general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    disable_loading_bar = false
    ignore_empty_input = true
}

# ─────────────────────────────────────────────
# Background
# ─────────────────────────────────────────────

background {
    monitor =
    path = ~/Images/Walls/neon.png
    color = rgba(0, 0, 0, 1.0)

    blur_passes = 2
    blur_size = 4

    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ─────────────────────────────────────────────
# Clock
# ─────────────────────────────────────────────

label {
    monitor =
    text = $TIME

    font_family = JetBrains Mono
    font_size = 96
    font_weight = 700

    color = rgba(ff7800ff)

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(ff780088)

    position = 0, 150
    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# Date
# ─────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_family = JetBrains Mono
    font_size = 20
    font_weight = 500

    color = rgba(ffffffff)

    position = 0, 70
    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# Password field
# ─────────────────────────────────────────────

input-field {
    monitor =

    size = 360, 64
    outline_thickness = 2

    outer_color = rgba(ff7800ff)
    inner_color = rgba(0, 0, 0, 0.55)

    font_color = rgba(ffffffff)

    dots_size = 0.25
    dots_spacing = 0.18
    dots_center = true

    fade_on_empty = false
    placeholder_text = <i>Password</i>
    hide_input = false

    position = 0, -100
    halign = center
    valign = center

    rounding = 12
}

# ─────────────────────────────────────────────
# User
# ─────────────────────────────────────────────

label {
    monitor =
    text = $USER

    font_family = JetBrains Mono
    font_size = 18
    font_weight = 600

    color = rgba(ff7800ff)

    position = 0, -30
    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# Failed authentication
# ─────────────────────────────────────────────

label {
    monitor =
    text = $FAIL
    font_family = JetBrains Mono
    font_size = 16

    color = rgba(ff5555ff)

    position = 0, -180
    halign = center
    valign = center
}
